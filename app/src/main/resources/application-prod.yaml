# 값은 서버 환경 변수로 주입
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
motif:
  crypto:
    secret-key: ${CRYPTO_SECRET_KEY}
  jwt:
    secret: ${JWT_SECRET}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
