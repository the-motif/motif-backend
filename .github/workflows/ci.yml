name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

# 같은 브랜치 새 커밋이 오면 이전 실행 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Gradle 캐시 / wrapper 검증 포함
      - uses: gradle/actions/setup-gradle@v4

      # 테스트는 Testcontainers (러너에 Docker 기본 설치)
      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: '**/build/reports/tests/test/'
          retention-days: 7
